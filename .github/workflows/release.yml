name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUT="dug_${VERSION}_${GOOS}_${GOARCH}${EXT}"
          mkdir -p dist

          go build \
            -ldflags "-s -w \
              -X github.com/khareutkarshk/dug/internal/version.Version=${VERSION} \
              -X github.com/khareutkarshk/dug/internal/version.Commit=${COMMIT} \
              -X github.com/khareutkarshk/dug/internal/version.Date=${DATE}" \
            -o "dist/${OUT}" \
            ./cmd/dug

          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "${OUT%.exe}.zip" "${OUT}"
          else
            tar -czf "${OUT}.tar.gz" "${OUT}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dug-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
