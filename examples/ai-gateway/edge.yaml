server:
  port: 8080
  retries: 0
  rate_limit:
    rps: 1000
    burst: 1000
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s

routes:
  - path: /openai/
    timeout: 10s
    strategy: smooth_weighted
    response_headers:
      add:
        X-AI-Provider: openai
    upstreams:
      - url: http://openai-mock:3001
        weight: 1

  - path: /ollama/
    timeout: 10s
    strategy: smooth_weighted
    response_headers:
      add:
        X-AI-Provider: ollama
    upstreams:
      - url: http://ollama-mock:3002
        weight: 1
