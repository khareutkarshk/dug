server:
  port: 8080
  retries: 0

  tls:
    enabled: false
    cert_file: certs/server.crt
    key_file: certs/server.key

  rate_limit:
    rps: 20
    burst: 20

  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s

routes:
  - path: /
    timeout: 5s
    strategy: least_connections

    request_headers:
      add:
        X-Gateway: DUG
        X-Version: v1

      remove:
        - X-Internal

    response_headers:
      add:
        X-Powered-By: DUG

      remove:
        - Server

    cors:
      enabled: true

      allow_origins:
        - "*"

      allow_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

      allow_headers:
        - Authorization
        - Content-Type

      expose_headers:
        - X-Request-ID

      allow_credentials: false

      max_age: 3600

    upstreams:
      - url: http://backend1:3001
        weight: 1

      - url: http://backend2:3002
        weight: 1