server:
  port: 8080
  retries: 0
  rate_limit:
    rps: 1000
    burst: 1000
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s

routes:
  - path: /
    timeout: 5s
    # Smooth weighted round robin — change weights to shift traffic
    strategy: smooth_weighted
    response_headers:
      add:
        X-Powered-By: DUG
    upstreams:
      # Blue = current stable (90%)
      - url: http://blue:3001
        weight: 9
      # Green = candidate release (10%)
      - url: http://green:3002
        weight: 1
