server:
  port: 8080
  retries: 0
  rate_limit:
    rps: 1000
    burst: 1000
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s

routes:
  - path: /api/
    timeout: 5s
    strategy: least_connections
    cors:
      enabled: true
      allow_origins:
        - "http://localhost:3000"
        - "http://frontend:3000"
      allow_methods: ["GET", "POST", "OPTIONS"]
      allow_headers: ["Content-Type", "Authorization"]
      expose_headers: ["X-Request-ID", "X-Powered-By"]
      allow_credentials: false
      max_age: 3600
    response_headers:
      add:
        X-Powered-By: DUG
    upstreams:
      - url: http://api1:3001
        weight: 1
      - url: http://api2:3002
        weight: 1
